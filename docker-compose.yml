services:
  redis:
    image: redis:7-alpine
    container_name: doc-verifier-redis
    ports:
      - "6379:6379"
    # Use Redis configuration file for reliable settings
    command: redis-server /etc/redis/redis.conf
    volumes:
      - ./redis.conf:/etc/redis/redis.conf:ro
    networks:
      - doc-verifier-network
    restart: unless-stopped
    healthcheck:
      # Test Redis is accepting connections and verify bind config
      test: ["CMD-SHELL", "redis-cli ping | grep PONG && redis-cli CONFIG GET bind | grep -q 0.0.0.0"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: doc-verifier-api
    ports:
      - "5002:5002"
    environment:
      # GitHub Models API
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      
      # Model Configuration
      - DEFAULT_MODEL=${DEFAULT_MODEL:-Llama 4 Maverick 17B 128E Instruct FP8}
      - DEFAULT_TEMPERATURE=${DEFAULT_TEMPERATURE:-0.7}
      - DEFAULT_MAX_TOKENS=${DEFAULT_MAX_TOKENS:-2000}
      - API_TIMEOUT_SECONDS=${API_TIMEOUT_SECONDS:-120}
      
      # Preprocessing Mode (per document type)
      # 0 = No preprocessing, 1 = Token optimization, 2 = Quality enhancement
      - PREPROCESSING_INDEX_2=${PREPROCESSING_INDEX_2:-0}
      - PREPROCESSING_NOC=${PREPROCESSING_NOC:-1}
      - PREPROCESSING_NO_DUES=${PREPROCESSING_NO_DUES:-1}
      
      # Image Optimization Settings
      - MAX_IMAGE_WIDTH=${MAX_IMAGE_WIDTH:-1536}
      - MAX_IMAGE_HEIGHT=${MAX_IMAGE_HEIGHT:-1536}
      - JPEG_QUALITY=${JPEG_QUALITY:-85}
      - ENABLE_AUTO_CROP=${ENABLE_AUTO_CROP:-false}
      - ENABLE_GRAYSCALE=${ENABLE_GRAYSCALE:-false}
      
      # Embedding Model
      - EMBEDDING_MODEL_NAME=${EMBEDDING_MODEL_NAME:-intfloat/multilingual-e5-base}
      - EMBEDDING_DIMENSION=${EMBEDDING_DIMENSION:-768}
      
      # API Configuration
      - API_HOST=0.0.0.0
      - API_PORT=5002
      - API_TITLE=${API_TITLE:-Document Verification API}
      - API_VERSION=${API_VERSION:-1.0.0}
      
      # Logging
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      
      # Security Settings
      - API_TOKEN=${API_TOKEN:-}
      - SWAGGER_PASSWORD=${SWAGGER_PASSWORD:-}
      - BEARER_TOKEN=${BEARER_TOKEN:-}
      
      # Celery Configuration
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      
      # Webhook Configuration
      - WEBHOOK_ENABLE=${WEBHOOK_ENABLE:-false}
      - WEBHOOK_URL=${WEBHOOK_URL:-}
      - WEBHOOK_TOKEN=${WEBHOOK_TOKEN:-}
      # Temporary directory configuration for PyTorch/transformers
      - TMPDIR=/tmp
      - TMP=/tmp
    volumes:
      # Mount prompts directory if you want to edit prompts without rebuilding
      - ./prompts:/app/prompts:ro
    tmpfs:
      # Mount /tmp as tmpfs with 2GB space to prevent "No space left" errors
      # PyTorch/transformers libraries create temporary directories during import
      - /tmp:rw,noexec,nosuid,size=2g
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - doc-verifier-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5002/api/v1/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: doc-verifier-worker
    # Wait for Redis healthcheck, then start Celery (depends_on ensures Redis is healthy)
    command: celery -A core.celery worker --loglevel=info --concurrency=2
    environment:
      # GitHub Models API
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      
      # Model Configuration
      - DEFAULT_MODEL=${DEFAULT_MODEL:-Llama 4 Maverick 17B 128E Instruct FP8}
      - DEFAULT_TEMPERATURE=${DEFAULT_TEMPERATURE:-0.7}
      - DEFAULT_MAX_TOKENS=${DEFAULT_MAX_TOKENS:-2000}
      - API_TIMEOUT_SECONDS=${API_TIMEOUT_SECONDS:-120}
      
      # Preprocessing Mode (per document type)
      # 0 = No preprocessing, 1 = Token optimization, 2 = Quality enhancement
      - PREPROCESSING_INDEX_2=${PREPROCESSING_INDEX_2:-0}
      - PREPROCESSING_NOC=${PREPROCESSING_NOC:-1}
      - PREPROCESSING_NO_DUES=${PREPROCESSING_NO_DUES:-1}
      
      # Image Optimization Settings
      - MAX_IMAGE_WIDTH=${MAX_IMAGE_WIDTH:-1536}
      - MAX_IMAGE_HEIGHT=${MAX_IMAGE_HEIGHT:-1536}
      - JPEG_QUALITY=${JPEG_QUALITY:-85}
      - ENABLE_AUTO_CROP=${ENABLE_AUTO_CROP:-false}
      - ENABLE_GRAYSCALE=${ENABLE_GRAYSCALE:-false}
      
      # Embedding Model
      - EMBEDDING_MODEL_NAME=${EMBEDDING_MODEL_NAME:-intfloat/multilingual-e5-base}
      - EMBEDDING_DIMENSION=${EMBEDDING_DIMENSION:-768}
      
      # API Configuration
      - API_HOST=0.0.0.0
      - API_PORT=5002
      - API_TITLE=${API_TITLE:-Document Verification API}
      - API_VERSION=${API_VERSION:-1.0.0}
      
      # Logging
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      
      # Security Settings (not needed for worker, but included for consistency)
      - API_TOKEN=${API_TOKEN:-}
      - SWAGGER_PASSWORD=${SWAGGER_PASSWORD:-}
      - BEARER_TOKEN=${BEARER_TOKEN:-}
      
      # Celery Configuration
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      
      # Webhook Configuration
      - WEBHOOK_ENABLE=${WEBHOOK_ENABLE:-false}
      - WEBHOOK_URL=${WEBHOOK_URL:-}
      - WEBHOOK_TOKEN=${WEBHOOK_TOKEN:-}
      # Temporary directory configuration for PyTorch/transformers
      - TMPDIR=/tmp
      - TMP=/tmp
    volumes:
      - ./prompts:/app/prompts:ro
    tmpfs:
      # Mount /tmp as tmpfs with 2GB space to prevent "No space left" errors
      # PyTorch/transformers libraries create temporary directories during import
      - /tmp:rw,noexec,nosuid,size=2g
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_started
    # Give Redis extra time after healthcheck passes
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    restart: unless-stopped
    networks:
      - doc-verifier-network

networks:
  doc-verifier-network:
    driver: bridge

