# Redis configuration for Docker
# This ensures Redis accepts connections from other containers

# Bind to all interfaces
bind 0.0.0.0

# Disable protected mode (required for Docker networking)
protected-mode no

# Disable persistence (for development, saves disk space)
appendonly no
save ""

# Memory limits
maxmemory 256mb
maxmemory-policy allkeys-lru

# Network settings
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300
