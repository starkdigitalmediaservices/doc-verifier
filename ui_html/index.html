<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PMC Document Verifier</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📄 PMC Document Verification System</h1>
            <p class="subtitle">Verify documents using AI-powered accuracy scoring</p>
        </header>

        <div class="config-section">
            <h2>⚙️ Configuration</h2>
            <div class="form-group">
                <label for="apiUrl">API Base URL:</label>
                <input type="text" id="apiUrl" value="http://34.227.36.59:5002" placeholder="http://34.227.36.59:5002">
            </div>
            <div class="form-group">
                <label for="apiToken">API Token (optional):</label>
                <input type="password" id="apiToken" placeholder="Leave empty if API token is not required">
                <small style="color: var(--text-secondary); font-size: 0.9em;">Required if API_TOKEN is set in server configuration</small>
            </div>
        </div>

        <div class="documents-section">
            <div class="section-header">
                <h2>📋 Documents</h2>
                <button id="addDocumentBtn" class="btn btn-primary">+ Add Document</button>
            </div>
            <div id="documentsContainer"></div>
        </div>

        <div class="actions-section">
            <button id="submitBtn" class="btn btn-submit" disabled>🚀 Submit for Verification</button>
            <button id="clearBtn" class="btn btn-secondary">🗑️ Clear All</button>
        </div>

        <div id="loadingSection" class="loading-section hidden">
            <div class="spinner"></div>
            <p>Processing documents... This may take a few moments.</p>
        </div>

        <div id="resultsSection" class="results-section hidden">
            <h2>📊 Results</h2>
            <div id="summarySection" class="summary-section"></div>
            <div id="detailedResults" class="detailed-results"></div>
        </div>

        <div id="errorSection" class="error-section hidden">
            <h3>❌ Error</h3>
            <div id="errorMessage"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
